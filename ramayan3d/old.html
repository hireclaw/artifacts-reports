<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>रामायण</title>
<meta property="og:title" content="रामायण">
<meta property="og:description" content="राम जन्म से पहली दीपावली तक · 15 मिनट की कठपुतली फ़िल्म">
<meta property="og:type" content="video.movie">
<meta property="og:image" content="https://ramayan-afjal.sites.tab.bot/poster.jpg">
<meta name="theme-color" content="#1a0d05">
<style>
  html,body{margin:0;background:#1a0d05;color:#f6e3c0;font-family:"Noto Sans Devanagari","Mukta",system-ui,sans-serif}
  main{max-width:1100px;margin:0 auto;padding:18px 12px 32px}
  h1{font-size:clamp(34px,8vw,64px);margin:6px 0 2px;text-align:center;color:#ffcc66;letter-spacing:1px;text-shadow:0 0 18px rgba(255,150,40,.45)}
  p.sub{text-align:center;margin:0 0 16px;opacity:.85;font-size:clamp(14px,3.6vw,18px)}
  .frame{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;box-shadow:0 0 0 2px #6b3a12,0 10px 40px rgba(0,0,0,.6)}
  video{width:100%;height:100%;display:block;background:#000}
  footer{text-align:center;margin-top:18px;font-size:14px;opacity:.7}
  a{color:#ffcc66}
</style>
</head>
<body>
<main>
  <h1>रामायण</h1>
  <p class="sub">राम जन्म से पहली दीपावली तक · 15 मिनट</p>
  <div class="frame">
    <video id="v" controls playsinline preload="metadata" poster="poster.jpg"></video>
  </div>
  <footer>शुभ दीपावली 🪔</footer>
</main>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script>
  var v=document.getElementById('v'), src='hls/master.m3u8';
  if (v.canPlayType('application/vnd.apple.mpegurl')) { v.src=src; }
  else if (window.Hls && Hls.isSupported()) { var h=new Hls({capLevelToPlayerSize:true}); h.loadSource(src); h.attachMedia(v); }
  else { v.src='hls/1080/index.m3u8'; }
</script>
</body>
</html>
