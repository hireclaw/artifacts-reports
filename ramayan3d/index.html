<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>रामायण — 3D</title>
<meta property="og:title" content="रामायण — 3D">
<meta property="og:description" content="राम जन्म से पहली दीपावली तक · Three.js में बनी पूरी 3D फ़िल्म">
<meta property="og:type" content="video.movie">
<meta property="og:image" content="poster.jpg">
<meta name="theme-color" content="#1a0d05">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#0d0603;overflow:hidden;font-family:Georgia,'Noto Serif Devanagari',serif}
  #wrap{position:fixed;inset:0}
  #gl{width:100%;height:100%;display:block}
  #titles{position:fixed;top:9%;left:0;right:0;text-align:center;pointer-events:none;z-index:5}
  .chapter{opacity:0;transform:translateY(10px);transition:opacity 1.1s ease,transform 1.1s ease}
  .chapter.on{opacity:1;transform:none}
  .chapter .hi{display:block;color:#f5d9a0;font-size:clamp(28px,4.6vw,54px);letter-spacing:.08em;
    text-shadow:0 2px 24px rgba(255,150,40,.45),0 1px 2px rgba(0,0,0,.8)}
  .chapter .en{display:block;color:#c9a06a;font-size:clamp(12px,1.5vw,17px);letter-spacing:.34em;
    text-transform:uppercase;margin-top:10px;opacity:.8}
  #bar{position:fixed;left:0;bottom:0;height:3px;width:100%;transform-origin:left;transform:scaleX(0);
    background:linear-gradient(90deg,#8a4a12,#ffb54a 60%,#ffd98a);z-index:6;opacity:.85}
  #play{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:26px;background:radial-gradient(ellipse at 50% 42%,#2a1204 0%,#0d0603 70%);
    cursor:pointer;border:0;width:100%}
  #play .diya{width:86px;height:86px;border-radius:50%;position:relative;
    background:radial-gradient(circle at 50% 38%,#ffd98a 0%,#ff9040 42%,transparent 70%);
    filter:drop-shadow(0 0 34px rgba(255,160,60,.55));animation:pulse 2.2s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:.92}50%{transform:scale(1.07);opacity:1}}
  #play .txt{color:#f5d9a0;font-size:clamp(20px,3vw,30px);letter-spacing:.14em}
  #play .hint{color:#9a7a52;font-size:13px;letter-spacing:.3em;text-transform:uppercase}
  #loading{position:fixed;top:18px;right:20px;color:#8a6a42;font-size:12px;letter-spacing:.2em;z-index:9}
  body.qa #bar{opacity:0}
  .credit{position:fixed;left:14px;bottom:10px;color:#6a5236;font-size:11px;z-index:6;opacity:.75}
</style>
</head>
<body>
<div id="wrap"><canvas id="gl"></canvas></div>
<div id="titles"></div>
<div id="bar"></div>
<button id="play" aria-label="Play">
  <div class="diya"></div>
  <div class="txt">रामायण — 3D</div>
  <div class="hint">Tap to begin · sound on</div>
</button>
<div id="loading">LOADING</div>
<div class="credit">शुभ दीपावली 🪔 · <a href="old.html" style="color:#8a6a42">original puppet film</a></div>
<script type="module" src="app.js"></script>
</body>
</html>
